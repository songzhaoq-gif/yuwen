<div class="app">
<header class="top"><div class="brand"><div class="appIcon"><span>语</span><span>数</span><span>英</span></div><div><h1>二年级全科复习宝</h1><p>Apple Pencil 手写识别版 · 语数英</p></div></div><div class="pill">⭐ <span id="stars">0</span></div></header>
<main id="home" class="page active"><section class="hero"><h2>今天开始认真复习</h2><p>语文支持触控笔写田字格，系统识别成汉字后自动判断。</p><div class="grid"><button class="cardBtn" onclick="openUnits()"><div class="emoji">✍️</div><div><h3>语文手写默写</h3><p>听写、田字格、自动判题</p></div></button><button class="cardBtn" onclick="openQuiz('math')"><div class="emoji">➕</div><div><h3>数学复习</h3><p>计算、应用题、时间质量</p></div></button><button class="cardBtn" onclick="openQuiz('english')"><div class="emoji">🔤</div><div><h3>英语复习</h3><p>单词、句型、听读</p></div></button><button class="cardBtn" onclick="daily()"><div class="emoji">📅</div><div><h3>每日复习</h3><p>语数英混合</p></div></button><button class="cardBtn" onclick="openMistakes()"><div class="emoji">📕</div><div><h3>错题本</h3><p>自动收集错题</p></div></button><button class="cardBtn" onclick="openStats()"><div class="emoji">📊</div><div><h3>学习统计</h3><p>正确率和星星</p></div></button></div></section></main>
<main id="units" class="page"><div class="nav"><button class="back" onclick="goHome()">← 返回</button><div class="title">选择语文单元</div><button class="smallBtn" onclick="startAll()">全部词语</button></div><div id="unitGrid" class="unitGrid"></div></main>
<main id="practice" class="page"><div class="practice"><section class="panel"><div class="progressTop"><button class="back" onclick="goHome()">←</button><b id="practiceTitle">生词默写</b><div class="bar"><span id="fill"></span></div><button class="smallBtn" onclick="toggleSide()">进度</button></div><div class="center"><div id="meta" class="meta"></div><button class="speak" onclick="speakCurrent()">🔊 播放听写</button><div id="writeGrid" class="writeGrid"></div><div class="handNote">用 Apple Pencil 直接写在田字格里；iPad 会把手写内容识别成汉字。手机测试时也可以点格子打字。</div><div id="fb" class="fb"></div><div id="tip" class="tip"></div><div class="actions"><button class="btn ghost" onclick="showTip()">💡 我需要提示</button><button class="btn ghost" onclick="clearBoxes()">↻ 重写</button><button class="btn warn" onclick="skip()">跳过</button><button class="btn primary" onclick="submitHandwriting()">提交</button></div></div></section><aside id="side" class="panel side"><h3>当前练习</h3><div class="mini"><div><b id="done">0</b>已学</div><div><b id="total">0</b>总词</div><div><b id="acc">0%</b>正确</div></div><h3>词表进度</h3><div id="wordList" class="wordList"></div></aside></div></main>
<main id="quiz" class="page"><div class="nav"><button class="back" onclick="goHome()">← 返回</button><div id="quizTitle" class="title"></div><button class="smallBtn" onclick="newQ()">换一题</button></div><div class="quiz"><div id="qType" style="color:var(--muted);font-weight:800"></div><h2 id="qText"></h2><div id="options" class="options"></div><div id="qFb" class="fb"></div><div id="qEx" class="tip show" style="display:none"></div></div></main>
<main id="mistakes" class="page"><div class="nav"><button class="back" onclick="goHome()">← 返回</button><div class="title">错题本</div><button class="smallBtn" onclick="clearMistakes()">清空</button></div><div id="mistakeBox"></div></main>
<main id="stats" class="page"><div class="nav"><button class="back" onclick="goHome()">← 返回</button><div class="title">学习统计</div><button class="smallBtn" onclick="resetStats()">重置</button></div><div class="grid"><div class="cardBtn"><div class="emoji">✍️</div><h3 id="stTotal">0</h3><p>累计练习</p></div><div class="cardBtn"><div class="emoji">✅</div><h3 id="stRight">0</h3><p>正确</p></div><div class="cardBtn"><div class="emoji">📕</div><h3 id="stWrong">0</h3><p>错误</p></div><div class="cardBtn"><div class="emoji">⭐</div><h3 id="stStars">0</h3><p>学习星星</p></div></div></main>
</div>

function updateStars(){$('stars').textContent=store.stats.stars||0}function goHome(){page('home');updateStars()}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function openUnits(){page('units');$('unitGrid').innerHTML='';DATA.units.forEach((u,i)=>{let b=document.createElement('button');b.className='unit';b.innerHTML=`<h3>${u.name}</h3><p>共 ${u.words.length} 词</p>`;b.onclick=()=>startUnit(i);$('unitGrid').appendChild(b)})}

function startPractice(unit,words){state={unit,words,order:shuffle(words.map((_,i)=>i)),idx:0,right:0,wrong:0,tips:0};$('practiceTitle').textContent=unit+' · 手写默写';page('practice');renderWord();setTimeout(speakCurrent,350)}function cur(){return state.words[state.order[state.idx]]}

function handleBoxInput(e,i){let v=e.target.value;if(v.length>1){let chars=[...v];let boxes=[...document.querySelectorAll('.hanziInput')];chars.forEach((c,k)=>{if(boxes[i+k])boxes[i+k].value=c})}let boxes=[...document.querySelectorAll('.hanziInput')];if(e.target.value&&boxes[i+1])boxes[i+1].focus()}

function makeTips(w){let a=[...w];let len=a.length;let t=[`这是一个${len}个字的词语。`,`第一个字是“${a[0]}”。`];if(len>=4)t.push('可能是四字词语或成语，想想课文里的表达。');else t.push('想想这个词在课文里的意思，再试着写。');return t}
function showTip(){let item=cur(),tips=makeTips(item.word);state.tips++;let n=Math.min(state.tips,tips.length+1);$('tip').className='tip show';let html=tips.slice(0,Math.min(n,tips.length)).map((t,i)=>`<div>提示${i+1}：${t}</div>`).join('');if(n>tips.length)html+=`<hr><div>答案：<b>${item.word}</b></div>`;$('tip').innerHTML=html}

function renderProgress(){let total=state.words.length,done=state.idx;$('fill').style.width=(total?Math.round(done/total*100):0)+'%';$('done').textContent=done;$('total').textContent=total;$('acc').textContent=(done?Math.round(state.right/(state.right+state.wrong)*100):0)+'%';let list=$('wordList');list.innerHTML='';state.order.forEach((orig,pos)=>{let w=state.words[orig].word;let div=document.createElement('div');div.className='wordRow '+(pos===state.idx?'cur':pos<state.idx?'done':'');div.innerHTML=`<span>${pos+1}. ${w}</span><span>${pos<state.idx?'✓':pos===state.idx?'正在写':'○'}</span>`;list.appendChild(div)})}function toggleSide(){let s=$('side');s.style.display=s.style.display==='none'?'block':'none'}

function openQuiz(sub){quiz.subject=sub;page('quiz');$('quizTitle').textContent=sub==='math'?'数学复习':'英语复习';newQ()}function newQ(){let pool=quiz.subject==='math'?DATA.math:DATA.english;quiz.q=pool[Math.floor(Math.random()*pool.length)];$('qType').textContent=quiz.q.type;$('qText').textContent=quiz.q.q;$('qFb').textContent='';$('qEx').style.display='none';let box=$('options');box.innerHTML='';quiz.q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>choose(i);box.appendChild(b)})}function choose(i){let q=quiz.q,opts=[...document.querySelectorAll('.opt')];opts.forEach((o,k)=>{if(k===q.a)o.classList.add('correct');if(k===i&&k!==q.a)o.classList.add('wrong');o.disabled=true});let s=store.stats;s.total++;if(i===q.a){$('qFb').textContent='✓ 正确';$('qFb').className='fb ok';s.right++;s.stars++}else{$('qFb').textContent='写错了，看看思路';$('qFb').className='fb bad';s.wrong++;addMistake(quiz.subject==='math'?'数学':'英语',q.q,'正确答案：'+q.options[q.a]+'；'+q.ex)}store.stats=s;$('qEx').textContent=q.ex;$('qEx').style.display='block';setTimeout(newQ,i===q.a?900:2300)}function daily(){Math.random()<.34?openUnits():openQuiz(Math.random()<.5?'math':'english')}
function addMistake(sub,title,detail){let a=store.mistakes;a.unshift({sub,title,detail,time:new Date().toLocaleString()});store.mistakes=a.slice(0,250)}function openMistakes(){page('mistakes');let a=store.mistakes,box=$('mistakeBox');if(!a.length){box.innerHTML='<div class="empty">暂时没有错题，继续保持！</div>';return}box.innerHTML=a.map((m,i)=>`<div class="quiz" style="margin-bottom:14px"><div style="color:var(--muted)">${m.sub}｜${m.time}</div><h2>${m.title}</h2><p>${m.detail}</p><button class="btn ghost" onclick="removeMistake(${i})">已掌握，移除</button></div>`).join('')}function removeMistake(i){let a=store.mistakes;a.splice(i,1);store.mistakes=a;openMistakes()}function clearMistakes(){if(confirm('确定清空错题本吗？')){store.mistakes=[];openMistakes()}}
