<body><div class="app">
<header class="header"><div class="brand"><div class="logo">语数英</div><div><h1>二年级全科复习宝</h1><p>上海小学二年级｜语文 · 数学 · 英语</p></div></div><div class="userBadge">⭐ <span id="starCount">0</span></div></header>
<main id="home" class="page active"><section class="hero"><h2>今天也要认真复习呀</h2><p>语文按你提供的词语表做全量覆盖；数学、英语按二年级常见考点做练习。</p><div class="grid"><button class="cardBtn" onclick="openUnits()"><div class="icon">✍️</div><div><h3>语文默写</h3><p>生词全量覆盖，随机顺序</p></div></button><button class="cardBtn" onclick="openSubjectQuiz('math')"><div class="icon">➕</div><div><h3>数学复习</h3><p>计算、应用、时间、质量</p></div></button><button class="cardBtn" onclick="openSubjectQuiz('english')"><div class="icon">🔤</div><div><h3>英语复习</h3><p>单词、句型、听读</p></div></button><button class="cardBtn" onclick="openDaily()"><div class="icon">📅</div><div><h3>每日复习</h3><p>语数外混合</p></div></button><button class="cardBtn" onclick="openMistakes()"><div class="icon">📕</div><div><h3>错题本</h3><p>自动收集错题</p></div></button><button class="cardBtn" onclick="openStats()"><div class="icon">📊</div><div><h3>学习统计</h3><p>正确率和星星</p></div></button></div></section></main>
<main id="units" class="page"><div class="navbar"><button class="back" onclick="goHome()">← 返回</button><div class="title">选择语文单元</div><button class="back" onclick="startAllYuwen()">全部词语</button></div><div id="unitGrid" class="unitGrid"></div><p class="footerNote">每单元随机的是顺序，不抽样；全部词语必须出现，不遗漏。</p></main>
<main id="practice" class="page"><div class="practiceWrap"><section class="practiceMain"><div class="progressTop"><button class="back" onclick="finishPractice()">←</button><div style="font-weight:800" id="practiceTitle">生词默写</div><div class="progressBar"><span id="progressFill"></span></div><button class="back" onclick="toggleSide()">进度</button></div><div class="questionBox"><div id="questionMeta" style="color:var(--muted)">第 1 / 1 词</div><button class="listenBtn" onclick="speakCurrent()">🔊 播放听写</button><div class="pinyin" id="pinyinText"></div><div class="tianzige" id="tianzige"></div><input id="answerInput" class="answerInput" placeholder="在这里输入汉字" autocomplete="off" /><div id="feedback" class="feedback"></div><div id="tipBox" class="tipBox"></div><div class="actions"><button class="btn ghost" onclick="showTip()">💡 我需要提示</button><button class="btn ghost" onclick="resetInput()">↻ 重写</button><button class="btn warn" onclick="skipWord()">跳过</button><button class="btn primary" onclick="checkAnswer()">提交</button></div></div></section><aside class="side" id="sidePanel"><h3>当前练习</h3><div class="statsMini"><div class="statItem"><b id="doneCount">0</b>已学</div><div class="statItem"><b id="totalCount">0</b>总数</div><div class="statItem"><b id="accCount">0%</b>正确</div></div><h3>单元词表</h3><div id="wordList" class="wordList"></div></aside></div></main>
<main id="subjectQuiz" class="page"><div class="navbar"><button class="back" onclick="goHome()">← 返回</button><div class="title" id="quizTitle">数学复习</div><button class="back" onclick="newQuizQuestion()">换一题</button></div><div class="quizCard"><div id="quizType" style="color:var(--muted);font-weight:700"></div><h2 id="quizQuestion" style="font-size:28px;line-height:1.5"></h2><div id="quizOptions" class="options"></div><div id="quizFeedback" class="feedback"></div><div id="quizExplain" class="tipBox show" style="display:none"></div></div></main>
<main id="mistakes" class="page"><div class="navbar"><button class="back" onclick="goHome()">← 返回</button><div class="title">错题本</div><button class="back" onclick="clearMistakes()">清空</button></div><div id="mistakeBox"></div></main>
<main id="stats" class="page"><div class="navbar"><button class="back" onclick="goHome()">← 返回</button><div class="title">学习统计</div><button class="back" onclick="resetStats()">重置</button></div><div class="grid"><div class="cardBtn"><div class="icon">✍️</div><div><h3 id="sTotal">0</h3><p>累计练习</p></div></div><div class="cardBtn"><div class="icon">✅</div><div><h3 id="sRight">0</h3><p>正确数量</p></div></div><div class="cardBtn"><div class="icon">📕</div><div><h3 id="sWrong">0</h3><p>错误数量</p></div></div><div class="cardBtn"><div class="icon">⭐</div><div><h3 id="sStar">0</h3><p>学习星星</p></div></div></div></main></div>

const MATH_QUESTIONS=[{type:"千以内数",q:"486 里面有几个百、几个十、几个一？",options:["4个百8个十6个一","48个百6个一","4个十86个一","486个十"],a:0,ex:"三位数从左到右分别是百位、十位、个位。"},{type:"三位数加法",q:"325 + 247 = ?",options:["562","572","582","672"],a:1,ex:"个位进1，十位相加得7，百位相加得5，所以是572。"},{type:"三位数减法",q:"700 - 268 = ?",options:["432","442","532","468"],a:0,ex:"700-268=432。"},{type:"时间",q:"1小时20分钟等于多少分钟？",options:["80分钟","70分钟","120分钟","90分钟"],a:0,ex:"1小时=60分钟，60+20=80。"},{type:"质量",q:"下面哪个物品最可能重 1 千克？",options:["一粒米","一头大象","一袋盐","一张纸"],a:2,ex:"生活中一袋盐比较接近这个重量。"},{type:"应用题",q:"小明有236张贴纸，又买了128张，一共有多少张？",options:["354","364","374","464"],a:1,ex:"236+128=364。"},{type:"减法应用",q:"图书角有560本书，借走175本，还剩多少本？",options:["385","395","485","375"],a:0,ex:"560-175=385。"},{type:"找规律",q:"120，130，140，150，下面应该是？",options:["151","155","160","170"],a:2,ex:"每次增加10。"}];
const ENGLISH_QUESTIONS=[{type:"word",q:"“铅笔” 的英文是？",options:["pencil","ruler","rubber","book"],a:0,ex:"pencil 是铅笔。"},{type:"word",q:"“苹果” 的英文是？",options:["pear","apple","orange","banana"],a:1,ex:"apple 是苹果。"},{type:"sentence",q:"What can you see? 合适回答是：",options:["I can see a bird.","I am fine.","It is red.","Thank you."],a:0,ex:"这是问你能看到什么。"},{type:"sentence",q:"“我喜欢狗。”可以说：",options:["I like dogs.","I am dogs.","I see dogs.","I have red."],a:0,ex:"I like dogs. 表示我喜欢狗。"},{type:"word",q:"“春天” 的英文是？",options:["spring","summer","autumn","winter"],a:0,ex:"spring 是春天。"},{type:"greeting",q:"How are you? 的合适回答是：",options:["I'm fine, thank you.","It is a cat.","I see blue.","I like rice."],a:0,ex:"这是日常问候。"},{type:"color",q:"green 是什么颜色？",options:["绿色","红色","黄色","蓝色"],a:0,ex:"green 是绿色。"},{type:"number",q:"twelve 是数字几？",options:["10","11","12","20"],a:2,ex:"twelve 是12。"}];
let state={unitName:"",words:[],order:[],index:0,right:0,wrong:0,tipsShown:0};let quizState={subject:"math",current:null};
const store={get stats(){return JSON.parse(localStorage.getItem("stats")||'{"total":0,"right":0,"wrong":0,"stars":0}')},set stats(v){localStorage.setItem("stats",JSON.stringify(v));updateStar()},get mistakes(){return JSON.parse(localStorage.getItem("mistakes")||"[]")},set mistakes(v){localStorage.setItem("mistakes",JSON.stringify(v))}};
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}function goHome(){showPage('home');updateStar()}function updateStar(){document.getElementById('starCount').textContent=store.stats.stars||0}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function openUnits(){showPage('units');const box=document.getElementById('unitGrid');box.innerHTML='';YUWEN_UNITS.forEach((u,i)=>{let b=document.createElement('button');b.className='unitCard';b.innerHTML=`<h3>${u.name}</h3><p>共 ${u.words.length} 词</p>`;b.onclick=()=>startYuwenUnit(i);box.appendChild(b)})}function startAllYuwen(){startPractice('全部词语',YUWEN_UNITS.flatMap(u=>u.words.map(w=>({word:w,unit:u.name}))))}function startYuwenUnit(i){let u=YUWEN_UNITS[i];startPractice(u.name,u.words.map(w=>({word:w,unit:u.name})))}
function startPractice(name,items){state={unitName:name,words:items,order:shuffle(items.map((_,i)=>i)),index:0,right:0,wrong:0,tipsShown:0};document.getElementById('practiceTitle').textContent=name+' · 生词默写';showPage('practice');renderQuestion()}function currentItem(){return state.words[state.order[state.index]]}
function renderQuestion(){let item=currentItem();if(!item){showSummary();return}let word=item.word;document.getElementById('questionMeta').textContent=`${state.unitName}　第 ${state.index+1} / ${state.words.length} 词`;document.getElementById('pinyinText').className='pinyin';document.getElementById('pinyinText').textContent='';document.getElementById('answerInput').value='';document.getElementById('answerInput').classList.remove('wrong');document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback';document.getElementById('tipBox').className='tipBox';document.getElementById('tipBox').innerHTML='';state.tipsShown=0;renderSquares([...word].length);renderProgress();setTimeout(()=>document.getElementById('answerInput').focus(),100)}function renderSquares(n){let box=document.getElementById('tianzige');box.innerHTML='';for(let i=0;i<n;i++){let s=document.createElement('div');s.className='square';box.appendChild(s)}}function renderProgress(){let done=state.index,total=state.words.length;document.getElementById('progressFill').style.width=Math.round(done/total*100)+'%';document.getElementById('doneCount').textContent=done;document.getElementById('totalCount').textContent=total;document.getElementById('accCount').textContent=(done?Math.round(state.right/(state.right+state.wrong)*100):0)+'%';let list=document.getElementById('wordList');list.innerHTML='';state.order.forEach((orig,pos)=>{let w=state.words[orig].word,row=document.createElement('div');row.className='wordRow '+(pos===state.index?'current':pos<state.index?'done':'');row.innerHTML=`<span>${pos+1}. ${w}</span><span>${pos<state.index?'✓':pos===state.index?'正在写':'○'}</span>`;list.appendChild(row)})}
function speak(text,lang='zh-CN'){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}function speakCurrent(){let item=currentItem();if(item)speak(item.word,'zh-CN')}
function makeTip(word){let n=[...word].length;let first=word[0]||'';let last=word[n-1]||'';return [`这是一个 ${n} 个字的词语，先想课文里的意思。`,`第一个字是“${first}”，最后一个字是“${last}”。`,`再听一遍读音，想想每个字的偏旁和结构。`]}function showTip(){let item=currentItem(),tips=makeTip(item.word),box=document.getElementById('tipBox');box.classList.add('show');if(state.tipsShown<tips.length){state.tipsShown++;box.innerHTML=tips.slice(0,state.tipsShown).map((t,i)=>`<div>提示 ${i+1}：${t}</div>`).join('')}else{box.innerHTML=tips.map((t,i)=>`<div>提示 ${i+1}：${t}</div>`).join('')+`<hr><div>答案：<b>${item.word}</b></div>`}}
function checkAnswer(){let input=document.getElementById('answerInput'),ans=input.value.trim().replace(/\s/g,''),word=currentItem().word,fb=document.getElementById('feedback');if(!ans)return;if(ans===word){fb.textContent='✓ 正确';fb.className='feedback ok';state.right++;let st=store.stats;st.total++;st.right++;st.stars++;store.stats=st;state.index++;renderProgress();setTimeout(renderQuestion,450)}else{input.classList.add('wrong');fb.textContent='写错了，再试一次';fb.className='feedback bad';state.wrong++;let st=store.stats;st.total++;st.wrong++;store.stats=st;addMistake({subject:'语文',title:word,detail:`${state.unitName} 默写错误，错误答案：${ans}`});setTimeout(()=>{input.value='';input.classList.remove('wrong');input.focus()},900)}}function resetInput(){let input=document.getElementById('answerInput');input.value='';input.classList.remove('wrong');input.focus();document.getElementById('feedback').textContent=''}function skipWord(){let item=currentItem();addMistake({subject:'语文',title:item.word,detail:`${state.unitName} 跳过，需重练`});state.wrong++;let st=store.stats;st.wrong++;store.stats=st;state.index++;renderQuestion()}function showSummary(){document.querySelector('.questionBox').innerHTML=`<h2 style="font-size:34px;color:var(--green)">本组完成</h2><p style="font-size:20px">正确：${state.right}　错误/跳过：${state.wrong}</p><div class="actions"><button class="btn primary" onclick="location.reload()">回首页</button></div>`;renderProgress()}function finishPractice(){goHome()}function toggleSide(){let s=document.getElementById('sidePanel');s.style.display=s.style.display==='none'?'block':'none'}document.getElementById('answerInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});
function openSubjectQuiz(subject){quizState.subject=subject;document.getElementById('quizTitle').textContent=subject==='math'?'数学复习':'英语复习';showPage('subjectQuiz');newQuizQuestion()}function newQuizQuestion(){let pool=quizState.subject==='math'?MATH_QUESTIONS:ENGLISH_QUESTIONS;quizState.current=pool[Math.floor(Math.random()*pool.length)];let q=quizState.current;document.getElementById('quizType').textContent=q.type;document.getElementById('quizQuestion').textContent=q.q;document.getElementById('quizFeedback').textContent='';document.getElementById('quizExplain').style.display='none';let box=document.getElementById('quizOptions');box.innerHTML='';q.options.forEach((op,i)=>{let b=document.createElement('button');b.className='option';b.textContent=op;b.onclick=()=>answerQuiz(i);box.appendChild(b)}); if(quizState.subject==='english') speak(q.q,'en-US')}function answerQuiz(i){let q=quizState.current,opts=[...document.querySelectorAll('.option')];opts.forEach((o,idx)=>{if(idx===q.a)o.classList.add('correct');if(idx===i&&idx!==q.a)o.classList.add('wrong');o.disabled=true});let fb=document.getElementById('quizFeedback'),ex=document.getElementById('quizExplain'),st=store.stats;st.total++;if(i===q.a){fb.textContent='✓ 正确';fb.className='feedback ok';st.right++;st.stars++}else{fb.textContent='写错了，看看思路再重练';fb.className='feedback bad';st.wrong++;addMistake({subject:quizState.subject==='math'?'数学':'英语',title:q.q,detail:`正确答案：${q.options[q.a]}；${q.ex}`})}store.stats=st;ex.textContent=q.ex;ex.style.display='block';setTimeout(newQuizQuestion,i===q.a?900:2200)}function openDaily(){Math.random()>.5?openSubjectQuiz('math'):openSubjectQuiz('english')}function addMistake(m){let arr=store.mistakes;arr.unshift({...m,time:new Date().toLocaleString()});store.mistakes=arr.slice(0,200)}function openMistakes(){showPage('mistakes');let arr=store.mistakes,box=document.getElementById('mistakeBox');if(!arr.length){box.innerHTML='<div class="empty">暂时没有错题，继续保持！</div>';return}box.innerHTML=arr.map((m,idx)=>`<div class="quizCard"><div style="color:var(--muted)">${m.subject}｜${m.time}</div><h2>${m.title}</h2><p>${m.detail}</p><button class="btn ghost" onclick="removeMistake(${idx})">已掌握，移除</button></div>`).join('')}function removeMistake(i){let arr=store.mistakes;arr.splice(i,1);store.mistakes=arr;openMistakes()}function clearMistakes(){if(confirm('确定清空错题本吗？')){store.mistakes=[];openMistakes()}}function openStats(){showPage('stats');let s=store.stats;document.getElementById('sTotal').textContent=s.total;document.getElementById('sRight').textContent=s.right;document.getElementById('sWrong').textContent=s.wrong;document.getElementById('sStar').textContent=s.stars}function resetStats(){if(confirm('确定重置学习统计吗？')){store.stats={total:0,right:0,wrong:0,stars:0};openStats()}}updateStar();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
</script></body></html>
